<style>
  :root{
    --bg:#fff; --fg:#000; --grey:#e0e0e0; --line:#000; --dim:#6b6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  nav.tabs{display:flex;}
  nav.tabs button{
    flex:1; padding:11px 4px; font-size:12px; letter-spacing:0.08em;
    text-transform:uppercase; background:var(--bg); color:var(--fg);
    border:none; border-right:1px solid var(--line); font-family:inherit; font-weight:400;
  }
  nav.tabs button:last-child{border-right:none;}
  nav.tabs button.active{background:var(--fg); color:var(--bg);}
  .search-bar{
    border-top:1px solid var(--line);
    padding:2px 16px;
  }
  .search-bar input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-weight:400;
    font-size:15.5px;
    padding:9px 0;
    color:var(--fg);
    -webkit-appearance:none;
  }
  .search-bar input::placeholder{color:var(--dim);}
  nav.days{display:flex; border-top:1px solid var(--line);}
  nav.days button{
    flex:1; padding:9px 4px; font-size:12px; letter-spacing:0.06em;
    text-transform:uppercase; background:var(--bg); color:var(--fg);
    border:none; border-right:1px solid var(--line); font-family:inherit; font-weight:400;
  }
  nav.days button:last-child{border-right:none;}
  nav.days button.active{background:var(--fg); color:var(--bg);}

  main{padding:0 16px;}

  .stage{
    padding-top:22px;
  }
  .stage-name{
    font-size:19px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .stage-note{
    font-size:12px;
    color:var(--dim);
  }
  .stage-rule{
    border-top:1px solid var(--line);
    margin-top:12px;
    margin-bottom:2px;
  }

  .act{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    width:100%;
    cursor:pointer;
    user-select:none;
  }
  .act:active{background:#f2f2f2;}
  .act.clash{background:#f2f2f2;}
  .act.clash:active{background:#e6e6e6;}
  .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--grey);
    margin-top:5px;
    flex:0 0 auto;
  }
  .act.on .dot{background:var(--fg);}
  .act-body{flex:1; min-width:0;}
  .act-name{
    font-size:15.5px;
    line-height:1.32;
  }
  .act-stage{
    font-size:12px;
    color:var(--dim);
    margin-top:3px;
    letter-spacing:0.02em;
  }
  .act-time{
    font-size:12px;
    color:var(--dim);
    margin-top:2px;
    letter-spacing:0.02em;
  }

  .day-header{
    font-size:19px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    padding:22px 0 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }

  .empty{
    padding:60px 4px;
    text-align:center;
    color:var(--dim);
    font-size:14px;
    line-height:1.6;
  }

  footer.count{
    position:sticky; bottom:0;
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:10px 16px;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--dim);
    text-align:center;
  }
</style>
</head>

const DAYS = ["Thursday","Friday","Saturday","Sunday"];

// ---------- STATE ----------
const STORE_KEY = "woh26-picks";
let picks = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]"));
let view = "all";
let currentDay = "Thursday";
let searchQuery = "";

function savePicks(){
  localStorage.setItem(STORE_KEY, JSON.stringify([...picks]));
}

function migrateOldPicks(){
  const migrated = new Set();
  let changed = false;
  picks.forEach(id => {
    const m = id.match(/^([A-Za-z]+)__(\d+)__(\d+)$/);
    if(m){
      changed = true;
      const day = m[1], si = Number(m[2]), ai = Number(m[3]);
      const stageObj = DATA[day] && DATA[day][si];
      const act = stageObj && stageObj.acts[ai];
      if(act) migrated.add(actId(day, stageObj.stage, act[0], act[1]));
    } else {
      migrated.add(id);
    }
  });
  if(changed){
    picks = migrated;
    savePicks();
  }
}
migrateOldPicks();

function sortKey(t){
  const [h,m] = t.split(":").map(Number);
  let mins = h*60+m;
  if(h < 6) mins += 24*60;
  return mins;
}

function actId(day, stage, name, start){
  return day + "|" + stage + "|" + start + "|" + name;
}

function timeRange(r){
  const s = sortKey(r.start);
  let e = sortKey(r.end);
  if(e <= s) e += 24*60;
  return [s, e];
}

function findClashes(rows){
  const ranges = rows.map(timeRange);
  rows.forEach((r, i) => {
    const [aStart, aEnd] = ranges[i];
    r.clashWith = [];
    rows.forEach((r2, j) => {
      if(i === j) return;
      const [bStart, bEnd] = ranges[j];
      if(aStart < bEnd && bStart < aEnd) r.clashWith.push(r2.name);
    });
  });
}

// ---------- RENDER ----------
const main = document.getElementById("main");
const dayNav = document.getElementById("day-nav");

function render(){
  const searching = searchQuery.length > 0;
  document.getElementById("tab-all").classList.toggle("active", !searching && view==="all");
  document.getElementById("tab-mine").classList.toggle("active", !searching && view==="mine");
  dayNav.style.display = (!searching && view==="all") ? "flex" : "none";
  const count = picks.size;
  document.getElementById("mine-count").textContent = count ? "("+count+")" : "";

  main.innerHTML = "";
  if(searching){
    renderSearch();
  } else if(view === "all"){
    renderAll();
  } else {
    renderMine();
  }
}

function renderSearch(){
  const q = searchQuery;
  let any = false;
  DAYS.forEach(day => {
    const stages = DATA[day];
    let rows = [];
    stages.forEach(s => {
      s.acts.forEach(a => {
        if(a[0].toLowerCase().includes(q) || s.stage.toLowerCase().includes(q)){
          rows.push({stage:s.stage, name:a[0], start:a[1], end:a[2]});
        }
      });
    });
    if(rows.length === 0) return;
    any = true;
    rows.sort((x,y) => sortKey(x.start) - sortKey(y.start));
    const hdr = document.createElement("div");
    hdr.className = "day-header";
    hdr.textContent = day;
    main.appendChild(hdr);
    rows.forEach(r => {
      main.appendChild(actRow(day, r.stage, r.name, r.start, r.end, true));
    });
  });
  if(!any){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No artists match “" + searchQuery + "”.";
    main.appendChild(empty);
  }
}

function renderAll(){
  const stages = DATA[currentDay];
  stages.forEach(s => {
    const stageEl = document.createElement("div");
    stageEl.className = "stage";
    const nameEl = document.createElement("div");
    nameEl.className = "stage-name";
    nameEl.textContent = s.stage;
    stageEl.appendChild(nameEl);
    if(s.note){
      const noteEl = document.createElement("div");
      noteEl.className = "stage-note";
      noteEl.textContent = s.note;
      stageEl.appendChild(noteEl);
    }
    const rule = document.createElement("div");
    rule.className = "stage-rule";
    stageEl.appendChild(rule);

    const acts = [...s.acts].sort((x, y) => sortKey(x[1]) - sortKey(y[1]));
    acts.forEach(a => {
      stageEl.appendChild(actRow(currentDay, s.stage, a[0], a[1], a[2], false));
    });
    main.appendChild(stageEl);
  });
}

function renderMine(){
  let any = false;
  DAYS.forEach(day => {
    const stages = DATA[day];
    let rows = [];
    stages.forEach(s => {
      s.acts.forEach(a => {
        const id = actId(day, s.stage, a[0], a[1]);
        if(picks.has(id)){
          rows.push({stage:s.stage, name:a[0], start:a[1], end:a[2]});
        }
      });
    });
    if(rows.length === 0) return;
    any = true;
    rows.sort((x,y) => sortKey(x.start) - sortKey(y.start));
    findClashes(rows);
    const hdr = document.createElement("div");
    hdr.className = "day-header";
    hdr.textContent = day;
    main.appendChild(hdr);
    rows.forEach(r => {
      main.appendChild(actRow(day, r.stage, r.name, r.start, r.end, true, r.clashWith));
    });
  });
  if(!any){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No acts picked yet.\nGo to All Acts and tap the ones you want to catch.";
    main.appendChild(empty);
  }
}

function actRow(day, stage, name, start, end, showStage, clashWith){
  const id = actId(day, stage, name, start);
  const hasClash = clashWith && clashWith.length > 0;
  const row = document.createElement("div");
  row.className = "act" + (picks.has(id) ? " on" : "") + (hasClash ? " clash" : "");
  row.dataset.id = id;

  const dot = document.createElement("div");
  dot.className = "dot";
  row.appendChild(dot);

  const body = document.createElement("div");
  body.className = "act-body";
  const nameEl = document.createElement("div");
  nameEl.className = "act-name";
  nameEl.textContent = name;
  body.appendChild(nameEl);

  if(showStage){
    const stageEl = document.createElement("div");
    stageEl.className = "act-stage";
    stageEl.textContent = stage;
    body.appendChild(stageEl);
  }

  const timeEl = document.createElement("div");
  timeEl.className = "act-time";
  timeEl.textContent = start + "–" + end;
  body.appendChild(timeEl);

  row.appendChild(body);

  row.addEventListener("click", () => {
    if(picks.has(id)){ picks.delete(id); } else { picks.add(id); }
    savePicks();
    render();
  });

  return row;
}

// ---------- NAV ----------
const searchInput = document.getElementById("search-input");

function clearSearch(){
  searchQuery = "";
  searchInput.value = "";
}

document.getElementById("tab-all").addEventListener("click", () => { view="all"; clearSearch(); render(); });
document.getElementById("tab-mine").addEventListener("click", () => { view="mine"; clearSearch(); render(); });
dayNav.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentDay = btn.dataset.day;
    dayNav.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  render();
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
